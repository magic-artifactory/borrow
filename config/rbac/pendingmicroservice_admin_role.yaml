# This rule is not used by the project borrow itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over brw.soigneux.works.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: borrow
    app.kubernetes.io/managed-by: kustomize
  name: pendingmicroservice-admin-role
rules:
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices
  verbs:
  - '*'
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices/status
  verbs:
  - get
