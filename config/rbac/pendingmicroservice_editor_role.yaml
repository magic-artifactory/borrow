# This rule is not used by the project borrow itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the brw.soigneux.works.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: borrow
    app.kubernetes.io/managed-by: kustomize
  name: pendingmicroservice-editor-role
rules:
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices/status
  verbs:
  - get
