# This rule is not used by the project borrow itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to brw.soigneux.works resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: borrow
    app.kubernetes.io/managed-by: kustomize
  name: pendingmicroservice-viewer-role
rules:
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - brw.soigneux.works
  resources:
  - pendingmicroservices/status
  verbs:
  - get
